<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img" aria-labelledby="title desc">
  <title id="title">법인전환의 절세 효과 및 이점</title>
  <desc id="desc">절세효과와 가업승계를 중심으로 다섯 가지 법인전환 효과가 원형 화살표를 따라 순환하는 홈페이지 프로필용 인포그래픽</desc>
  <defs>
    <style>
      #cycleArrows {
        transform-origin: 340px 345px;
        animation: cycleSpin 16s linear infinite;
      }
      #movingHighlight {
        stroke-dasharray: 24 38;
        animation: highlightFlow 3.6s linear infinite;
      }
      @keyframes cycleSpin { to { transform: rotate(360deg); } }
      @keyframes highlightFlow { to { stroke-dashoffset: -124; } }
      @media (prefers-reduced-motion: reduce) {
        #cycleArrows, #movingHighlight { animation: none; }
      }
    </style>
    <linearGradient id="ringGradient" x1="220" y1="225" x2="460" y2="465" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#73C6FF"/>
      <stop offset="0.45" stop-color="#397EF0"/>
      <stop offset="1" stop-color="#1D4DB2"/>
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4B72C5"/>
      <stop offset="1" stop-color="#17265E"/>
    </linearGradient>
    <radialGradient id="centerGradient" cx="40%" cy="32%" r="75%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF3FF"/>
    </radialGradient>
    <filter id="nodeShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0D1D4B" flood-opacity="0.27"/>
    </filter>
    <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="cleanArrowHead" markerWidth="15" markerHeight="15" viewBox="0 0 14 14"
            refX="12.5" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5 1.8 L12.5 7 L1.5 12.2 L4.2 7 Z"
            fill="#56A6FF" stroke="#D8EEFF" stroke-width="0.75" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="44" text-anchor="middle" fill="#2859A1"
        font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"
        font-size="29" font-weight="800" letter-spacing="-0.8">법인전환의 절세 효과 및 이점</text>
  <rect x="170" y="60" width="340" height="4" rx="2" fill="url(#ringGradient)" opacity="0.8"/>

  <g id="cycleArrows" filter="url(#ringGlow)">
    <circle cx="340" cy="345" r="120" fill="none" stroke="#173E96" stroke-width="10" opacity="0.98"/>
    <circle cx="340" cy="345" r="120" fill="none" stroke="url(#ringGradient)" stroke-width="7.5" opacity="0.98"/>
    <g fill="none" stroke="url(#ringGradient)" stroke-width="9" stroke-linecap="round"
       marker-end="url(#cleanArrowHead)">
      <path d="M340 225 A120 120 0 0 1 451.3 300.1"/>
      <path d="M454.1 307.9 A120 120 0 0 1 417.1 436.9"/>
      <path d="M410.5 442.1 A120 120 0 0 1 276.4 446.8"/>
      <path d="M269.5 442.1 A120 120 0 0 1 223.6 316.0"/>
      <path d="M225.9 307.9 A120 120 0 0 1 331.6 225.3"/>
    </g>
    <circle id="movingHighlight" cx="340" cy="345" r="120" fill="none"
            stroke="#D8EEFF" stroke-width="2.6" stroke-linecap="round" opacity="0.82"/>
  </g>

  <!-- 원형 화살표 중심 메시지 -->
  <circle cx="340" cy="345" r="78" fill="url(#centerGradient)" stroke="#8FC3FF" stroke-width="2.5" filter="url(#nodeShadow)"/>
  <circle cx="340" cy="345" r="69" fill="none" stroke="#C5E0FF" stroke-width="1.5"/>
  <text x="340" y="336" text-anchor="middle" fill="#1F4E99"
        font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"
        font-size="25" font-weight="850" letter-spacing="-0.7">
    <tspan x="340">절세효과</tspan><tspan x="340" dy="33">가업승계</tspan>
  </text>

  <g filter="url(#nodeShadow)">
    <circle cx="340" cy="140" r="72" fill="url(#nodeGradient)"/>
    <circle cx="535" cy="282" r="72" fill="url(#nodeGradient)"/>
    <circle cx="460" cy="511" r="75" fill="url(#nodeGradient)"/>
    <circle cx="220" cy="511" r="72" fill="url(#nodeGradient)"/>
    <circle cx="145" cy="282" r="72" fill="url(#nodeGradient)"/>
  </g>
  <g fill="none" stroke="#83BDFF" stroke-width="2" opacity="0.82">
    <circle cx="340" cy="140" r="65"/>
    <circle cx="535" cy="282" r="65"/>
    <circle cx="460" cy="511" r="68"/>
    <circle cx="220" cy="511" r="65"/>
    <circle cx="145" cy="282" r="65"/>
  </g>

  <g fill="#FFFFFF" text-anchor="middle"
     font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', sans-serif"
     font-size="21" font-weight="750" letter-spacing="-0.5">
    <text x="340" y="134"><tspan x="340">소득의</tspan><tspan x="340" dy="29">유형변경</tspan></text>
    <text x="535" y="276"><tspan x="535">소득의</tspan><tspan x="535" dy="29">귀속변경</tspan></text>
    <text x="460" y="483" font-size="19"><tspan x="460">가족법인 활용</tspan><tspan x="460" dy="26">절세 및</tspan><tspan x="460" dy="26">가업승계</tspan></text>
    <text x="220" y="481" font-size="19"><tspan x="220">소득의</tspan><tspan x="220" dy="26">귀속시기</tspan><tspan x="220" dy="26">변경</tspan></text>
    <text x="145" y="252" font-size="19"><tspan x="145">영업권 활용</tspan><tspan x="145" dy="26">법인세</tspan><tspan x="145" dy="26">절세</tspan></text>
  </g>
</svg>
